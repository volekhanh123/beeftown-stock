<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beeftown — Financial Simulator</title>
<style>
:root{
  --bg:#15110e; --panel:#1f1a16; --card:#272019; --card2:#2f261d;
  --grid:#403427; --txt:#f4ede2; --muted:#b6a690;
  --ember:#ff6a32; --ember2:#e2562a; --gold:#e8b04b; --green:#56c08d; --red:#ef6f6f; --blue:#6fb7e8;
}
*{box-sizing:border-box}
body{margin:0;background:#15110e;color:#f4ede2;font-family:"Segoe UI",system-ui,Arial,"Noto Sans KR",sans-serif;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-weight:800;font-size:26px;letter-spacing:.5px}
.brand b{color:var(--ember)}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.spacer{flex:1}
.langsw{display:flex;background:var(--card);border:1px solid #ffffff14;border-radius:10px;overflow:hidden}
.langsw button{background:transparent;color:var(--muted);border:0;padding:7px 12px;font-weight:700;cursor:pointer;font-size:13px}
.langsw button.on{background:var(--ember2);color:#fff}
.btn{background:var(--card);color:var(--txt);border:1px solid #ffffff1f;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid #ffffff10;border-left:3px solid var(--ember);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:21px;font-weight:800;margin-top:4px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.g{border-left-color:var(--green)} .kpi.b{border-left-color:var(--blue)} .kpi.gd{border-left-color:var(--gold)}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid #ffffff10;border-radius:14px;padding:14px}
.panel h3{margin:2px 0 10px;font-size:14px}
details{background:var(--card);border:1px solid #ffffff10;border-radius:10px;margin-bottom:10px;overflow:hidden}
details>summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--gold);list-style:none}
details>summary::-webkit-details-marker{display:none}
.gbody{padding:6px 12px 12px}
.ctrl{margin:10px 0}
.ctrl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctrl-top label{font-size:12.5px;color:var(--txt)}
.ctrl-top .num{width:104px;background:#120e0b;border:1px solid #ffffff1f;color:var(--txt);border-radius:7px;padding:4px 7px;text-align:right;font-size:12.5px}
.rng{width:100%;height:6px;border-radius:5px;background:var(--grid);margin-top:7px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{background:var(--card);border:1px solid #ffffff10;border-radius:12px;padding:12px}
.chart h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600}
.tablescroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid #ffffff0f;text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--gold);font-size:12px}
tr.tot td{font-weight:800;border-top:1px solid #ffffff22}
.pos{color:var(--green)} .neg{color:var(--red)}
.frgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.frbox{background:var(--card);border:1px solid #ffffff10;border-radius:10px;padding:10px 12px}
.frbox .l{color:var(--muted);font-size:11.5px} .frbox .v{font-size:18px;font-weight:800;margin-top:3px}
.menu-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.menu{min-width:620px}
.menu td .mi{width:100%;background:#120e0b;border:1px solid #ffffff1a;color:var(--txt);border-radius:6px;padding:4px 6px;font-size:12.5px;text-align:right}
.menu td .mi.name{text-align:left}
.del{background:#3a201c;border:1px solid #ffffff1a;color:var(--red);border-radius:6px;padding:3px 8px;cursor:pointer}
.note{color:var(--muted);font-size:11.5px;line-height:1.5;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:8px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.section-title{font-size:15px;font-weight:800;margin:22px 0 8px;color:var(--txt)}
@media(max-width:980px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
@media(max-width:560px){
 .wrap{padding:12px 12px 48px}.brand{font-size:21px}.kpis{gap:8px}
 .kpi{padding:10px 11px}.kpi .v{font-size:16px}.kpi .l{font-size:9.5px}
 .panel{padding:11px}.chart{padding:9px}.ctrl-top .num{width:88px}
 .rng{height:9px}table{font-size:12px}th,td{padding:6px 6px}.section-title{font-size:14px}
}
</style>
</head>

<div id="boot" style="position:fixed;left:0;right:0;top:0;z-index:9999;padding:10px 14px;background:#3a1d14;color:#ffd9a0;font:13px/1.45 Arial;border-bottom:1px solid #ff6a32">
Đang tải dashboard… Nếu dòng này KHÔNG biến mất sau 1–2 giây: file đang được mở bằng ô “xem trước” (không chạy được). Hãy mở bằng trình duyệt thật (Safari/Chrome).</div>
<script>
/* Bắt lỗi sớm và hiện ngay trên trang (kể cả lỗi cú pháp ở script kế tiếp). */
window.onerror=function(m,s,l){var b=document.getElementById('boot');if(b){b.style.background='#5a1a1a';b.style.color='#ffd2d2';b.textContent='Lỗi JS: '+m+(l?' (dòng '+l+')':'');}return false;};
</script>
<div class="wrap">
  <header>
    <div>
      <div class="brand">BEEF<b>TOWN</b></div>
      <div class="sub" data-t="subtitle"></div>
    </div>
    <div class="spacer"></div>
    <div class="langsw" id="langsw">
      <button data-lang="vi" class="on">VI</button>
      <button data-lang="en">EN</button>
      <button data-lang="ko">KO</button>
    </div>
    <button class="btn" id="reset" data-t="reset"></button>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="layout">
    <div class="panel">
      <h3 data-t="inputs_title"></h3>
      <details open><summary data-t="grp_revenue"></summary><div class="gbody" id="grp-revenue"></div></details>
      <details open><summary data-t="grp_varcost"></summary><div class="gbody" id="grp-varcost"></div></details>
      <details><summary data-t="grp_fixed"></summary><div class="gbody" id="grp-fixed"></div></details>
      <details><summary data-t="grp_capex"></summary><div class="gbody" id="grp-capex">
        <div class="ctrl"><div class="ctrl-top"><label data-t="in_deposit"></label><b id="depositVal"></b></div></div>
      </div></details>
      <details><summary data-t="grp_growth"></summary><div class="gbody" id="grp-growth"></div></details>
    </div>

    <div>
      <div class="charts">
        <div class="chart"><h4 data-t="ch_pl"></h4><div id="chPL"></div></div>
        <div class="chart"><h4 data-t="ch_cost"></h4><div id="chCost"></div><div class="legend" id="costLegend"></div></div>
        <div class="chart"><h4 data-t="ch_be"></h4><div id="chBE"></div></div>
        <div class="chart"><h4 data-t="ch_cash"></h4><div id="chCash"></div></div>
      </div>
      <div class="section-title" data-t="sec_pl"></div>
      <div class="panel"><div class="tablescroll"><table id="plTable"></table></div></div>
      <div class="section-title" data-t="sec_franchise"></div>
      <div class="panel"><div class="frgrid" id="frGrid"></div><div class="note" data-t="fr_note"></div></div>
    </div>
  </div>

  <div class="section-title" data-t="sec_menu"></div>
  <details class="panel" id="menuPanel">
    <summary style="font-size:14px;font-weight:700;color:var(--gold)" data-t="menu_open"></summary>
    <div style="padding-top:12px">
      <div class="note" data-t="menu_intro"></div>
      <div class="menu-tools">
        <button class="btn" id="addDish" data-t="menu_add"></button>
        <label class="toggle"><input type="checkbox" id="menuFeeds"><span data-t="menu_feed"></span></label>
      </div>
      <div class="tablescroll"><table class="menu"><thead><tr>
        <th data-t="m_name"></th><th data-t="m_price"></th><th data-t="m_food"></th>
        <th data-t="m_qty"></th><th data-t="m_cu"></th><th data-t="m_rev"></th><th data-t="m_contrib"></th><th></th>
      </tr></thead><tbody id="menuBody"></tbody>
      <tfoot><tr class="tot">
        <td data-t="m_total"></td><td></td><td id="mFood"></td><td></td><td></td><td id="mRev"></td><td id="mContrib"></td><td></td>
      </tr></tfoot></table></div>
      <div class="note" data-t="menu_note"></div>
    </div>
  </details>

  <div class="note" id="disclaimer" data-t="disclaimer"></div>
</div>

var nf=new Intl.NumberFormat('en-US');
function vnd(v){return nf.format(Math.round(v))+" ₫";}
function compact(v){v=+v;var a=Math.abs(v);
 if(lang==="ko"){if(a>=1e8)return (v/1e8).toFixed(2)+"억 ₫"; if(a>=1e4)return Math.round(v/1e4)+"만 ₫"; return vnd(v);}
 if(lang==="en"){if(a>=1e9)return (v/1e9).toFixed(2)+"B ₫"; if(a>=1e6)return (v/1e6).toFixed(1)+"M ₫"; return vnd(v);}
 if(a>=1e9)return (v/1e9).toFixed(2)+" tỷ"; if(a>=1e6)return Math.round(v/1e6)+" tr ₫"; return vnd(v);}
function pct(v){return (v*100).toFixed(1)+"%";}
function T(k){var v=I18N[lang][k]; return (v===undefined||v===null)?k:v;}
function esc(t){return String(t).replace(/"/g,'&quot;');}

function menuTotals(){var rev=0,cost=0,contrib=0;for(var i=0;i<menu.length;i++){var d=menu[i];var r=d.price*d.qty;rev+=r;cost+=r*(d.food/100);contrib+=r*(1-d.food/100);}
 return {rev:rev,cost:cost,contrib:contrib,foodPct:rev>0?cost/rev:0};}
function compute(){
 var s=state;
 var fill=s.fill/100, dPct=s.delivery/100;
 var food=s.food/100,labor=s.labor/100,util=s.util/100,mkt=s.mkt/100,other=s.other/100,comm=s.comm/100;
 var deposit=3*s.rent;
 var cVar=sum(custom.var.map(function(b){return b.val;}))/100;
 var cFixed=sum(custom.fixed.map(function(b){return b.val;}));
 var cCapex=sum(custom.capex.map(function(b){return b.val;}));
 var capex=deposit+s.construction+s.kitchen+s.furniture+s.posit+s.opening+s.wc+cCapex;
 var dineIn, foodPct=food;
 var mt=menuTotals();
 if(menuFeeds && mt.rev>0){dineIn=mt.rev*s.days; foodPct=mt.foodPct;}
 else {var covers=s.seats*s.turns*fill; dineIn=covers*s.ticket*s.days;}
 var coversDay=(menuFeeds&&mt.rev>0) ? (mt.rev/Math.max(s.ticket,1)) : s.seats*s.turns*fill;
 var delivery=dineIn*dPct;
 var totalRev=dineIn+delivery;
 var varExcl=foodPct+labor+util+mkt+other;
 var delShare=dPct/(1+dPct);
 var commOfTotal=comm*delShare;
 var blendedVar=varExcl+commOfTotal+cVar;
 var cm=1-blendedVar;
 var fixed=s.rent+s.software+s.otherfixed+cFixed;
 var beRev=cm>0?fixed/cm:Infinity;
 var beCoversDay=cm>0?(beRev/s.days)/Math.max(s.ticket,1):Infinity;
 var ebitdaM=totalRev*cm-fixed;
 var ebitdaY=ebitdaM*12;
 var steadyAnnual=totalRev*12;
 var y1rev=0,y1eb=0,monthsEB=[];
 for(var i=0;i<12;i++){var r=totalRev*RAMP[i];var e=r*cm-fixed;y1rev+=r;y1eb+=e;monthsEB.push(e);}
 var y2rev=steadyAnnual*(1+s.growthY2/100), y3rev=y2rev*(1+s.growthY3/100);
 var y2eb=y2rev*cm-fixed*12, y3eb=y3rev*cm-fixed*12;
 var cum=[],c=0,payback=null;
 for(var m=0;m<36;m++){c+=(m<12?monthsEB[m]:ebitdaM);cum.push(c);if(payback===null&&c>=capex)payback=m+1;}
 var roiSteady=capex>0?ebitdaY/capex:0;
 var evOutlet=ebitdaY*s.evmult;
 var frFee=s.franchiseFee*s.outlets, royaltyY=steadyAnnual*(s.royalty/100)*s.outlets;
 return {totalRev:totalRev,cm:cm,fixed:fixed,beRev:beRev,beCoversDay:beCoversDay,coversDay:coversDay,
  ebitdaM:ebitdaM,ebitdaY:ebitdaY,capex:capex,deposit:deposit,y1rev:y1rev,y1eb:y1eb,y2rev:y2rev,y2eb:y2eb,
  y3rev:y3rev,y3eb:y3eb,cum:cum,payback:payback,roiSteady:roiSteady,evOutlet:evOutlet,frFee:frFee,royaltyY:royaltyY,
  food:foodPct,labor:labor,util:util,mkt:mkt,other:other,commOfTotal:commOfTotal,customVarPct:cVar};
}

 var k=[
  ["kpi_rev",compact(M.totalRev),T("kpi_rev_s"),""],
  ["kpi_ebitda",compact(M.ebitdaM),pct(M.ebitdaM/M.totalRev),"g"],

  ["kpi_roi",pct(M.roiSteady),"","g"]
 ];
 var kh="";for(var i=0;i<k.length;i++){kh+='<div class="kpi '+k[i][3]+'"><div class="l">'+T(k[i][0])+'</div><div class="v">'+k[i][1]+'</div><div class="s">'+(k[i][2]||"")+'</div></div>';}
 byId("kpis").innerHTML=kh;
 byId("chPL").innerHTML=chartPL(M);
 byId("chCost").innerHTML=chartCost(M);
 byId("chBE").innerHTML=chartBE(M);
 byId("chCash").innerHTML=chartCash(M);
 var plHtml='<thead><tr><th>'+T("pl_item")+'</th><th>'+T("pl_y1")+'</th><th>'+T("pl_y2")+'</th><th>'+T("pl_y3")+'</th></tr></thead><tbody>'
  +'<tr><td>'+T("pl_rev")+'</td><td>'+vnd(M.y1rev)+'</td><td>'+vnd(M.y2rev)+'</td><td>'+vnd(M.y3rev)+'</td></tr>'
  +'<tr><td>'+T("pl_var")+'</td><td>'+vnd(M.y1rev-M.fixed*12-M.y1eb)+'</td><td>'+vnd(M.y2rev-M.fixed*12-M.y2eb)+'</td><td>'+vnd(M.y3rev-M.fixed*12-M.y3eb)+'</td></tr>'
  +'<tr><td>'+T("pl_fix")+'</td><td>'+vnd(M.fixed*12)+'</td><td>'+vnd(M.fixed*12)+'</td><td>'+vnd(M.fixed*12)+'</td></tr>'
  +'<tr class="tot"><td>'+T("pl_ebitda")+'</td><td class="'+(M.y1eb>=0?'pos':'neg')+'">'+vnd(M.y1eb)+'</td><td class="'+(M.y2eb>=0?'pos':'neg')+'">'+vnd(M.y2eb)+'</td><td class="'+(M.y3eb>=0?'pos':'neg')+'">'+vnd(M.y3eb)+'</td></tr>'
  +'<tr><td>'+T("pl_margin")+'</td><td>'+pct(M.y1eb/M.y1rev)+'</td><td>'+pct(M.y2eb/M.y2rev)+'</td><td>'+pct(M.y3eb/M.y3rev)+'</td></tr></tbody>';
 byId("plTable").innerHTML=plHtml;
 var fr=[["fr_outlets",state.outlets+""],["fr_fee",compact(M.frFee)],["fr_roy",compact(M.royaltyY)],["fr_ev1",compact(M.evOutlet)]];
 var fh="";for(var j=0;j<fr.length;j++){fh+='<div class="frbox"><div class="l">'+T(fr[j][0])+'</div><div class="v">'+fr[j][1]+'</div></div>';}
 byId("frGrid").innerHTML=fh;
 renderMenu();
}
function render(){ setText(); renderCustom(); renderOutputs(); }

function renderMenu(){
 var tb=byId("menuBody");var rows="";
 for(var i=0;i<menu.length;i++){var d=menu[i];var cu=d.price*(1-d.food/100),rev=d.price*d.qty,ct=cu*d.qty;
  rows+='<tr><td><input class="mi name" data-i="'+i+'" data-f="n" value="'+esc(d.n[lang]||d.n.vi)+'"></td>'
   +'<td><input class="mi" inputmode="numeric" data-i="'+i+'" data-f="price" value="'+d.price+'"></td>'
   +'<td><input class="mi" inputmode="numeric" data-i="'+i+'" data-f="food" value="'+d.food+'"></td>'
   +'<td><input class="mi" inputmode="numeric" data-i="'+i+'" data-f="qty" value="'+d.qty+'"></td>'
   +'<td>'+vnd(cu)+'</td><td>'+vnd(rev)+'</td><td>'+vnd(ct)+'</td>'
   +'<td><button class="del" data-i="'+i+'">x</button></td></tr>';}
 tb.innerHTML=rows;
 var t=menuTotals();
 byId("mFood").textContent=pct(t.foodPct);byId("mRev").textContent=vnd(t.rev);byId("mContrib").textContent=vnd(t.contrib);
 var ins=tb.querySelectorAll(".mi");
 for(var a=0;a<ins.length;a++){ins[a].addEventListener("input",function(){
   var ii=+this.getAttribute("data-i"),f=this.getAttribute("data-f");
   if(f==="n"){menu[ii].n={vi:this.value,en:this.value,ko:this.value};}
   else{var v=parseFloat(String(this.value).replace(/[^0-9.]/g,""));menu[ii][f]=isNaN(v)?0:v;}
   if(menuFeeds)render(); else renderMenu();});}
 var dels=tb.querySelectorAll(".del");
 for(var b3=0;b3<dels.length;b3++){dels[b3].addEventListener("click",function(){menu.splice(+this.getAttribute("data-i"),1);render();});}
}

(function init(){
 try{
  buildInputs();
  buildCustom();
  document.addEventListener("click",function(e){var b=e.target&&e.target.closest?e.target.closest("[data-add]"):null;if(!b)return;
   var ty=b.getAttribute("data-add");custom[ty].push({name:"",val:ty==="var"?2:(ty==="fixed"?5000000:50000000)});render();});
  byId("langsw").addEventListener("click",function(e){var b=e.target&&e.target.closest?e.target.closest("button"):null;if(!b)return;
   lang=b.getAttribute("data-lang");var bs=document.querySelectorAll("#langsw button");
   for(var i=0;i<bs.length;i++){bs[i].className=(bs[i]===b)?"on":"";}
   for(var j=0;j<PARAMS.length;j++){var nmm=document.querySelector('.num[data-k="'+PARAMS[j].k+'"]');if(nmm)nmm.value=fmtInput(PARAMS[j],state[PARAMS[j].k]);}
   render();});
  byId("reset").addEventListener("click",function(){for(var i=0;i<PARAMS.length;i++){state[PARAMS[i].k]=PARAMS[i].def;}
   for(var j=0;j<PARAMS.length;j++){var p=PARAMS[j];var nmm=document.querySelector('.num[data-k="'+p.k+'"]');var rr=document.querySelector('.rng[data-k="'+p.k+'"]');if(nmm)nmm.value=fmtInput(p,state[p.k]);if(rr)rr.value=state[p.k];}
   render();});
  byId("addDish").addEventListener("click",function(){menu.push({n:{vi:"Món mới",en:"New dish",ko:"새 메뉴"},price:99000,food:35,qty:10});render();});
  byId("menuFeeds").addEventListener("change",function(e){menuFeeds=e.target.checked;render();});
  render();
  var boot=byId("boot");if(boot)boot.style.display="none";
 }catch(err){
  var bb=byId("boot");if(bb){bb.style.background="#5a1a1a";bb.style.color="#ffd2d2";bb.textContent="Lỗi: "+(err&&err.message?err.message:err);}
 }
})();
</script>
