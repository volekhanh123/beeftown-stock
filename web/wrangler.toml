# Cấu hình Cloudflare Workers.
#
# `main` trỏ vào FILE NGUỒN src/worker.ts (không phải file trong dist/): adapter
# @astrojs/cloudflare v14 chạy qua Cloudflare Vite plugin, chỉ tự điền `main`
# khi nó vắng mặt, và build file nguồn này thành dist/server/entry.mjs.
# src/worker.ts = handler web mặc định của adapter + `scheduled` cho Cron
# Trigger đồng bộ iPOS (GĐ7a). KHÔNG khai `assets` — adapter tự sinh.
name = "beeftown"
compatibility_date = "2026-09-20"
main = "./src/worker.ts"

# nodejs_compat cần cho @supabase/supabase-js chạy trên workerd.
compatibility_flags = ["nodejs_compat"]

# Web chạy ở beeftown.vn (tên miền riêng gắn trên dashboard). Hai địa chỉ phụ
# của Cloudflare — <tên>.workers.dev và link xem trước từng phiên bản — cố ý TẮT.
# Không khai hai dòng này thì mỗi lần `wrangler deploy` tự bật lại cả hai.
workers_dev = false
preview_urls = false

# Chạy code ở trạm Cloudflare gần AWS Singapore (ap-southeast-1) — cùng vùng
# với Supabase. Không ghim thì người dùng ở Việt Nam hay được đưa vào trạm
# Hồng Kông, mà Google từ chối mọi lời gọi Gemini đi từ Hồng Kông ("User
# location is not supported for the API use") — máy dịch hỏng hết. Ảnh, CSS,
# JS tĩnh vẫn phát từ trạm gần người xem; chỉ phần chạy code (dựng trang, gọi
# database, gọi Gemini) chạy ở Singapore. Kiểm: header `cf-placement`.
[placement]
region = "aws:ap-southeast-1"

# Nhật ký (Workers Logs, giữ 7 ngày): Cloudflare → Workers & Pages → beeftown →
# Logs. Chỉ ghi các dòng console.* của code — mọi dòng đó đã bỏ token, email,
# số điện thoại, nội dung tin (sach / xoaBiMat / ghiQuaTai). TẮT nhật ký từng
# lượt gọi (invocation_logs): nó chép nguyên URL, mà /hook/ipos/<khóa> mang khóa
# bí mật ngay trong đường dẫn. Số lượt, tỉ lệ lỗi, thời gian CPU vẫn xem ở tab
# Metrics. Tìm "[qua-tai]" để biết nhân viên gặp trang "hệ thống đang bận" bao
# nhiêu lần — nhiều thì nâng hạn mức ở Supabase (README, mục Hạ tầng).
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# iPOS tự đẩy hóa đơn sang /hook/ipos/<khóa> (GĐ7c). Cron 5 phút chỉ thử lại
# dòng bán đang chờ và đọc thực đơn iPOS mỗi giờ — lượt rất nhẹ. Bí mật
# IPOS_CALLBACK_KHOA, IPOS_ACCESS_TOKEN, KHO_IPOS_EMAIL, KHO_IPOS_MAT_KHAU đặt
# bằng `npx wrangler secret put …` — KHÔNG ghi ở đây.
# Cron thứ hai "2-59/5 * * * *" (phút 2, 7, 12…): việc báo động (src/lib/bao-dong.ts,
# CRON_BAO_DONG phải trùng chuỗi này). Bí mật BAO_DONG_MAY_EMAIL, BAO_DONG_MAY_MAT_KHAU.
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *"]
