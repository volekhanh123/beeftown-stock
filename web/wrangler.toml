# Cấu hình Cloudflare Workers.
#
# KHÔNG khai `main` và `assets` ở đây: từ @astrojs/cloudflare v14, adapter
# chạy qua Cloudflare Vite plugin và tự sinh hai mục đó. Khai tay sẽ trỏ vào
# một file chưa tồn tại lúc build và làm hỏng cả lượt build.
name = "beeftown"
compatibility_date = "2026-09-20"

# nodejs_compat cần cho @supabase/supabase-js chạy trên workerd.
compatibility_flags = ["nodejs_compat"]

# Web chạy ở beeftown.vn (tên miền riêng gắn trên dashboard). Hai địa chỉ phụ
# của Cloudflare — <tên>.workers.dev và link xem trước từng phiên bản — cố ý TẮT.
# Không khai hai dòng này thì mỗi lần `wrangler deploy` tự bật lại cả hai.
workers_dev = false
preview_urls = false

# Chạy code ở trạm Cloudflare gần AWS Singapore (ap-southeast-1) — cùng vùng
# với Supabase. Không ghim thì người dùng ở Việt Nam hay được đưa vào trạm
# Hồng Kông, mà Google từ chối mọi lời gọi Gemini đi từ Hồng Kông ("User
# location is not supported for the API use") — máy dịch hỏng hết. Ảnh, CSS,
# JS tĩnh vẫn phát từ trạm gần người xem; chỉ phần chạy code (dựng trang, gọi
# database, gọi Gemini) chạy ở Singapore. Kiểm: header `cf-placement`.
[placement]
region = "aws:ap-southeast-1"
