# Dependabot — mở PR nâng thư viện, mỗi tháng một lần, mỗi thư mục gom thành một PR.
#
# Vì sao thưa và gom: mỗi PR nâng thư viện vẫn phải qua đủ CI (~10 phút) rồi có người đọc; một PR cho
# mỗi gói mỗi tuần thì không ai đọc nổi. Bản vá và bản nhỏ (patch, minor) đi chung một PR cho mỗi thư
# mục; bản lớn (major) đi PR riêng từng gói — bản lớn hay đổi cách dùng, cần đọc ghi chú phát hành.
#
# Lỗ hổng bảo mật không đợi lịch này: bật Dependabot security updates (Settings → Code security) thì
# GitHub mở PR riêng ngay khi có cảnh báo.
#
# PR của Dependabot cũng như mọi PR: CI xanh mới gộp, và CLAUDE.md vẫn áp dụng (CI đỏ là việc phải sửa,
# không nới kiểm thử). Nâng Playwright thì lượt CI đầu tải lại Chromium (khóa bộ nhớ đệm theo phiên bản).

version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'web: nâng thư viện'
    groups:
      web-ban-nho:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7: @astrojs/check 0.9.10 chỉ nhận peer typescript ^5 || ^6 — npm ci trong web/ hỏng (ERESOLVE),
      # CI "Kiểm thử" đỏ và cổng deploy chặn (PR #86, 26/10/2026). Khi @astrojs/check nhận TypeScript 7 thì bỏ cả khối
      # ignore: này (dòng ignore:, chú thích, hai dòng dưới); bỏ sót một dòng thì hoặc hỏng file, hoặc chặn luôn bản vá
      # và bản nhỏ của typescript.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /crm
    schedule:
      interval: monthly
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'crm: nâng thư viện'
    groups:
      crm-ban-nho:
        update-types: [minor, patch]
    ignore:
      # PGlite 0.5 trở đi là Postgres 18; Supabase production là 17 — test-quy-trinh.mjs mục 1 đỏ nếu lệch.
      - dependency-name: '@electric-sql/pglite'
        versions: ['>=0.5.0']

  - package-ecosystem: npm
    directory: /can-app
    schedule:
      interval: monthly
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'Beeftown Cân: nâng thư viện'
    groups:
      can-app-ban-nho:
        update-types: [minor, patch]

  # Mini App Zalo. Nâng zmp-sdk, zmp-ui, zmp-cli: đọc ghi chú phát hành của Zalo, đưa bản thử lên và bấm thử
  # gửi đơn trước khi gộp (mini-app/CLAUDE.md) — CI không chạy được Mini App trong Zalo. Bản phát hành đã
  # duyệt không tự đổi theo: đổi thư viện rồi muốn khách thấy thì phải gửi Zalo duyệt lại.
  - package-ecosystem: npm
    directory: /mini-app
    schedule:
      interval: monthly
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'Mini App: nâng thư viện'
    groups:
      mini-app-ban-nho:
        update-types: [minor, patch]
    ignore:
      # zmp-vite-plugin 1.1.6 (bản mới nhất của Zalo) chỉ nhận peer vite ^4.2.0 || ^5.0.0: vite 8 làm npm ci trong
      # mini-app/ hỏng (ERESOLVE), CI "Mini App Zalo" đỏ và dua-len-zalo.cmd dừng ở bước cài thư viện (PR #102, gộp
      # 26/10/2026). @vitejs/plugin-react 6 đòi vite ^8 nên chặn cùng. React 19 hỏng cùng kiểu: zmp-ui 1.11.14 dùng
      # @react-spring/web 9.5.5, chỉ nhận react 16–18 (PR #100). Khi zmp-vite-plugin nhận vite mới hơn, hay zmp-ui nhận
      # React 19, thì bỏ các dòng của gói đó; crm/test/test-mini-app-thu-vien.mjs đỏ nếu peer lệch. Các dòng này cũng chặn
      # PR bảo mật của Dependabot lên các bản đó — vite chỉ chạy trên máy build và máy thử, không nằm trong bản khách tải.
      - dependency-name: vite
        versions: ['>=6.0.0']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6.0.0']
      - dependency-name: react
        versions: ['>=19.0.0']
      - dependency-name: react-dom
        versions: ['>=19.0.0']
      - dependency-name: '@types/react'
        versions: ['>=19.0.0']
      - dependency-name: '@types/react-dom'
        versions: ['>=19.0.0']

  # actions/checkout, setup-node, cache, upload-artifact… trong .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'CI: nâng action'
    groups:
      actions:
        patterns: ['*']
