# Kiểm thử tự động — chạy toàn bộ kiểm tra của repo.
#
#   · Mỗi PR không phải nháp (và mỗi lần đẩy thêm vào PR đó): database + kho + Zalo + Messenger + Beeftown
#     Cân, và web (astro check, build, thử đóng gói Cloudflare, quét chữ cấm, trình duyệt thật).
#     PR thử trên COMMIT GỘP với main — đúng chỗ hai nhánh làm song song đụng nhau.
#     PR nháp: hai job đó bỏ qua (đỡ phút CI — người làm đã chạy kiểm thử trên máy); bấm "Ready for
#     review" thì chạy, và vẫn phải xanh mới gộp.
#   · Mỗi lần main nhận commit: chạy lại như trên, rồi báo vào PR đang mở nào vừa bị trùng số migration.
#   · Mỗi đêm 00:30 giờ Việt Nam (17:30 UTC): quét chữ cấm trên trang thật. Chạy lại toàn bộ với múi giờ
#     Việt Nam — đúng khung 0h–7h khi ngày UTC còn là hôm qua, lỗi múi giờ lộ ra ở đây — khi main có commit
#     trong 48 giờ qua, đêm Chủ nhật, đêm đầu và cuối tháng, hoặc khi không hỏi được GitHub (job co-doi). Đêm
#     khác mã y như đêm trước: bỏ qua đỡ ~14 phút CI. Cổng deploy bỏ qua lượt đêm không kiểm mã
#     (web/kiem-tra/ket-qua-ci.mjs).
#
# Đọc kết quả: tab Actions → lượt chạy → Summary (bảng từng file, số migration kế tiếp).
# Chạy tay: Actions → Kiểm thử → Run workflow (chọn múi giờ).

name: Kiểm thử

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '30 17 * * *'   # 00:30 giờ Việt Nam
  workflow_dispatch:
    inputs:
      mui_gio:
        description: Múi giờ của máy chạy kiểm thử
        type: choice
        options: [UTC, Asia/Ho_Chi_Minh]
        default: UTC

permissions:
  contents: read

concurrency:
  # Tên nhóm có cả loại sự kiện: lượt đêm không chung nhóm với lượt push lên main, nên một lần push
  # không thể hủy lượt đêm đang chờ (GitHub chỉ giữ MỘT lượt chờ mỗi nhóm).
  group: kiem-thu-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Đẩy commit mới vào PR thì bỏ lượt cũ đang chạy (tiết kiệm phút CI); main và lượt đêm chạy hết.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chỉ lượt đêm: có cần chạy hai job kiểm mã không. Chạy (chay=co) khi main có commit trong 48 giờ qua (một
  # lần gộp được hai đêm kiểm, lượt đêm có trễ vài giờ cũng không lọt), đêm Chủ nhật, đêm đầu và cuối tháng
  # (giờ VN — lỗi ngày tháng hay lộ ở đây dù mã không đổi), hoặc khi không hỏi được GitHub. Còn lại chay=khong:
  # mã y như đêm trước, bỏ qua đỡ ~14 phút CI. Job này không được làm lượt đêm đỏ (continue-on-error, gh có hạn
  # giờ); cổng deploy cũng không tính nó là job kiểm mã. Tên job: JOB_XEM_DOI trong web/kiem-tra/ket-qua-ci.mjs.
  co-doi:
    name: Lượt đêm có cần kiểm mã không
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    outputs:
      chay: ${{ steps.xem.outputs.chay }}
    steps:
      - name: Đếm commit của main trong 48 giờ qua, xem thứ và ngày (giờ VN)
        id: xem
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TU=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          THU=$(TZ=Asia/Ho_Chi_Minh date +%u)
          NGAY=$(TZ=Asia/Ho_Chi_Minh date +%d)
          NGAY_MAI=$(TZ=Asia/Ho_Chi_Minh date -d tomorrow +%d)
          N=$(timeout 60 gh api "repos/$REPO/commits?sha=main&since=$TU&per_page=1" --jq 'length' 2>/dev/null) || N=loi
          if [ "$THU" = 7 ]; then CHAY=co; LY_DO="đêm Chủ nhật — mỗi tuần chạy đủ một lần"
          elif [ "$NGAY" = 01 ] || [ "$NGAY_MAI" = 01 ]; then CHAY=co; LY_DO="đêm đầu / cuối tháng"
          elif [ "$N" = 0 ]; then CHAY=khong; LY_DO="main không có commit nào từ $TU"
          else CHAY=co; LY_DO="main có commit mới, hoặc không hỏi được GitHub ($N)"; fi
          echo "chay=$CHAY" >> "$GITHUB_OUTPUT"
          if [ "$CHAY" = co ]; then VIEC='chạy đủ kiểm thử'; else VIEC='bỏ qua hai job kiểm mã, chỉ quét trang thật'; fi
          echo "Lượt đêm: $LY_DO → $VIEC." | tee -a "$GITHUB_STEP_SUMMARY"

  database-va-can:
    name: Database · kho · Zalo · Messenger · Beeftown Cân
    needs: co-doi
    # !cancelled(): job co-doi bỏ qua (mọi lượt trừ lượt đêm) thì job này vẫn chạy.
    if: >-
      ${{ !cancelled()
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
      && (github.event_name != 'schedule' || needs.co-doi.outputs.chay != 'khong') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # PR và main: UTC như Cloudflare Workers và Supabase. Lượt đêm: giờ Việt Nam như máy ở quán.
      TZ: ${{ inputs.mui_gio || (github.event_name == 'schedule' && 'Asia/Ho_Chi_Minh') || 'UTC' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # cần lịch sử và mọi nhánh: so migration với main, test quét git ls-files
          # Chỉ tải commit và cây thư mục; nội dung file chỉ tải cho commit đang thử (và file nào lệnh git
          # đọc tới, khi cần). Nhánh phan-mem-can-cu (~39 MB nén) không còn bị tải về mỗi lượt.
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            crm/package-lock.json
            can-app/package-lock.json
      - name: Cài thư viện (web trước — test database đọc cả mã web)
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm ci --prefix crm --no-audit --no-fund
          npm ci --prefix can-app --no-audit --no-fund
      - name: Gác số migration
        env:
          SO_VOI: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before) || 'origin/main' }}
        run: node crm/test/kiem-migration.mjs --so-voi "$SO_VOI"
      - name: Toàn bộ kiểm thử database, kho, Zalo, Messenger
        working-directory: crm
        run: node test/chay-tat-ca.mjs --tat-ca
      - name: Kiểm thử Beeftown Cân (cân giả, kho giả)
        working-directory: can-app
        run: npx bun test/thu.ts
      # Sau kiểm thử, chạy cả khi kiểm thử hỏng: lỗi kiểu không che kết quả kiểm thử, kiểm thử hỏng không che lỗi kiểu.
      - name: Kiểm kiểu Beeftown Cân (tsc strict — can-app/tsconfig.json)
        if: ${{ !cancelled() }}
        working-directory: can-app
        run: npm run kiem-kieu
      # 2.11 — giao diện Beeftown Cân trong Chromium thật cho từng vai (can-app/test/thu-trinh-duyet.ts): đọc mã không bắt được
      # lỗi lúc chạy (một biến bị xoá là mọi vai chỉ thấy khung lỗi). Playwright của web/ (vừa npm ci ở trên); Chromium giữ
      # trong bộ nhớ đệm như job web, cùng khoá theo phiên bản Playwright. Chạy cả khi kiểm thử, kiểm kiểu ở trên hỏng.
      - name: Phiên bản Playwright (cho Beeftown Cân)
        id: playwright
        if: ${{ !cancelled() }}
        working-directory: web
        run: echo "phien-ban=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Lấy Chromium từ bộ nhớ đệm
        id: chromium
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-${{ steps.playwright.outputs.phien-ban }}
      - name: Cài Chromium
        if: ${{ !cancelled() && steps.chromium.outputs.cache-hit != 'true' }}
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Cài thư viện hệ thống cho Chromium
        if: ${{ !cancelled() && steps.chromium.outputs.cache-hit == 'true' }}
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Kiểm thử giao diện Beeftown Cân trong Chromium (từng vai)
        if: ${{ !cancelled() }}
        working-directory: can-app
        run: npx bun test/thu-trinh-duyet.ts

  web:
    name: Web · astro check · build · chữ cấm · trình duyệt
    needs: co-doi
    # Cùng điều kiện với job database-va-can.
    if: >-
      ${{ !cancelled()
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
      && (github.event_name != 'schedule' || needs.co-doi.outputs.chay != 'khong') }}
    runs-on: ubuntu-24.04
    # 7 cỡ màn hình × 21 trang (thu-trinh-duyet) và trạng thái có database (thu-day-du, astro dev).
    timeout-minutes: 30
    # KHÔNG có web/.env: trang công khai phải đúng và đủ khi chưa nối database (README của web).
    env:
      # Như job database: lượt đêm chạy giờ Việt Nam — build, Supabase giả và Chromium (đọc TZ cho Date,
      # Intl) đều theo giờ quán, đúng khung 0h–7h khi ngày UTC còn là hôm qua.
      TZ: ${{ inputs.mui_gio || (github.event_name == 'schedule' && 'Asia/Ho_Chi_Minh') || 'UTC' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài thư viện
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Kiểm tra kiểu (astro check)
        working-directory: web
        run: npx astro check
      - name: Build
        working-directory: web
        run: npx astro build
      - name: Thử đóng gói Cloudflare (không deploy)
        working-directory: web
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler"
      - name: Quét chữ cấm trên trang công khai (bản build, wrangler dev)
        working-directory: web
        run: npm run quet -- --khong-build   # bước Build ở trên vừa build
      # Chromium (~300 MB) tải lại mỗi lượt thì chậm và hỏng theo mạng của CDN. Giữ trong bộ nhớ đệm của
      # Actions theo đúng phiên bản Playwright: nâng Playwright thì khóa đổi, lượt đầu tải bản mới.
      - name: Phiên bản Playwright
        id: playwright
        working-directory: web
        run: echo "phien-ban=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Lấy Chromium từ bộ nhớ đệm
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-${{ steps.playwright.outputs.phien-ban }}
      - name: Cài Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      # Bộ nhớ đệm chỉ giữ Chromium; thư viện hệ thống (apt) của máy chạy CI thì cài lại mỗi lượt.
      - name: Cài thư viện hệ thống cho Chromium
        if: steps.chromium.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Kiểm thử trình duyệt (khách thật mở trang, bấm form)
        working-directory: web
        run: npm run thu-trinh-duyet -- --khong-build   # bước Build ở trên vừa build
      # Trạng thái CI không tự có: đã nối database (Supabase giả kiem-tra/gia-supabase.mjs) — Facebook,
      # Maps, thực đơn đã công bố, form hỏi bàn mở, bấm gửi hai lần, database 500, mạng đứt giữa chừng.
      - name: Kiểm thử trình duyệt khi đã nối database (Supabase giả)
        working-directory: web
        run: npm run thu-day-du
      - name: Ảnh chụp khi hỏng
        if: failure()
        uses: actions/upload-artifact@v7   # cùng bản với dong-goi-can.yml, sao-luu.yml (v4 còn chạy trên Node 20)
        with:
          name: anh-loi-trinh-duyet
          path: web/kiem-tra/anh-loi/
          if-no-files-found: ignore
          retention-days: 14

  quet-trang-that:
    name: Quét chữ cấm trên trang đang chạy thật
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Đổi địa chỉ ở Settings → Secrets and variables → Actions → Variables → DIA_CHI_WEB.
      DIA_CHI_WEB: ${{ vars.DIA_CHI_WEB || 'https://beeftown.vn' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài thư viện
        working-directory: web
        run: npm ci --no-audit --no-fund
      # Nội dung thật do công tắc trong /noi-bo quyết định, không nằm trong code — chỉ lượt này thấy nó.
      # Trang không trả lời cũng làm bước này đỏ: lượt đêm kiêm luôn việc kiểm tra trang còn sống.
      - name: Quét ${{ env.DIA_CHI_WEB }}
        working-directory: web
        run: npm run quet -- --url "$DIA_CHI_WEB"

  bao-pr-trung-so:
    name: Báo PR đang mở bị trùng số migration
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Đọc migration của từng nhánh bằng git show: file nào cần mới tải (xem job đầu).
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      # PR xanh lúc mở vẫn có thể hỏng khi PR khác gộp trước với cùng số migration — CI của nó không tự
      # chạy lại. Bước này kiểm lại từng PR ngay khi main đổi và comment vào PR đó (sửa comment cũ, không
      # đăng thêm). Phiên Claude đang theo dõi PR nhận được comment và tự đánh lại số.
      - name: Kiểm từng PR đang mở
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          DAU='<!-- gac-migration -->'
          DS=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"')
          # Đọc danh sách qua fd 3 để lệnh bên trong vòng lặp không nuốt mất stdin.
          while read -r SO NHANH <&3; do
            [ -n "$SO" ] || continue
            git rev-parse --verify --quiet "origin/$NHANH" >/dev/null || continue
            if node crm/test/kiem-migration.mjs --nhanh "origin/$NHANH" > ket-qua.txt 2>&1; then DAT=1; else DAT=0; fi
            CU=$(gh api "repos/$REPO/issues/$SO/comments" --paginate \
                  --jq "[.[] | select(.body | contains(\"$DAU\"))][0].id // empty" | head -n 1)
            if [ "$DAT" = 0 ]; then
              LOI=$(sed 's/\x1b\[[0-9;]*m//g' ket-qua.txt | grep -E '✗|! ' | sed 's/^ *//')
              printf '%s\n### ⚠️ Số migration của PR này không còn hợp lệ\n\nMain vừa nhận commit %s. Kiểm lại nhánh `%s`:\n\n```\n%s\n```\n\n**Cách sửa:** gộp `origin/main` vào nhánh, đổi số migration mới thành số kế tiếp (`cd crm && npm run so-migration`), rồi chạy lại `npm test`.\n' \
                "$DAU" "$SHA" "$NHANH" "$LOI" > noi-dung.md
              echo "PR #$SO ($NHANH): KHÔNG hợp lệ"
            elif [ -n "$CU" ]; then
              printf '%s\n### ✅ Số migration của PR này đã hợp lệ trở lại\n\n(kiểm lúc main ở commit %s)\n' "$DAU" "$SHA" > noi-dung.md
              echo "PR #$SO ($NHANH): đã hợp lệ trở lại"
            else
              echo "PR #$SO ($NHANH): hợp lệ"
              continue
            fi
            if [ -n "$CU" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$CU" -F body=@noi-dung.md > /dev/null
            else
              gh pr comment "$SO" --repo "$REPO" --body-file noi-dung.md
            fi
          done 3<<< "$DS"
