# Đóng gói Beeftown Cân — ra file BeeftownCan.exe để tải về từ GitHub, không cần gõ lệnh.
#
#   · Main nhận commit đụng thứ đi vào file .exe — can-app/, mã dùng chung trong web/src/lib/ (can-tma.ts,
#     danh-muc-can.ts, gio-vn.ts, câu tiếng Anh…), ảnh biểu tượng dong-goi.ts đọc: kiểm thử (2.11: cả giao diện trong
#     Chromium, test/thu-trinh-duyet.ts) → đóng gói → artifact
#     "BeeftownCan-<phiên bản>" (PHIEN_BAN trong can-app/src/main.ts). Phiên bản chưa có Release thì tạo Release
#     "Beeftown Cân <phiên bản>" kèm file zip — Release giữ mãi.
#   · PR đụng cùng những chỗ đó: chỉ đóng gói thử, bắt lỗi đóng gói trước khi gộp (kiểm thử Beeftown Cân đã chạy
#     ở kiem-thu.yml). KHÔNG tải file lên.
#   · Chạy tay: Actions → Đóng gói Beeftown Cân → Run workflow. Gõ số PR (ví dụ 31) để lấy bản thử của PR
#     trước khi gộp; để trống thì đóng gói nhánh chọn ở "Use workflow from".
#   · 2.5 — nút "Cập nhật" trong chương trình: job phat-hanh đưa BeeftownCan.exe + phien-ban.json (phiên bản, SHA-256,
#     cỡ) lên kho CÔNG KHAI volekhanh123/beeftown-can-ban-cai (chỉ file cài, không mã nguồn), bằng secret
#     TOKEN_BAN_CAI_CAN (token chỉ ghi được kho đó). Chưa có secret thì chỉ cảnh báo ở Summary. Thêm secret muộn:
#     Run workflow trên main để đưa bù phiên bản hiện tại.
#
# Dung lượng: repo private có hạn mức lưu trữ artifact (gói Free 500 MB, tính theo giờ), mỗi bản ~40 MB.
# Nên tab Actions chỉ giữ MỘT bản chính thức (bản mới xoá bản cũ), bản thử giữ 7 ngày, lượt PR không tải lên.
# Bản theo phiên bản nằm ở Releases, không tính vào hạn mức này.
#
# Cách tải cho người không đọc code: can-app/README.md, mục "Tải BeeftownCan.exe về".

name: Đóng gói Beeftown Cân
# Lượt bản thử PR chạy trên nhánh main nên danh sách Actions cũng ghi "main" — đặt tên riêng cho khỏi nhầm với
# bản chính thức. Chuỗi rỗng thì GitHub đặt tên như thường (dòng commit, hay tên workflow khi chạy tay).
run-name: ${{ inputs.so_pr != '' && format('🧪 Bản thử PR {0} — chỉ để thử, không dùng lâu ở quán', inputs.so_pr) || '' }}

on:
  push:
    branches: [main]
    paths:
      - 'can-app/**'
      - 'web/src/lib/**'
      - 'web/public/kho/bieu-tuong-192.png'
      - '.github/workflows/dong-goi-can.yml'
  pull_request:
    paths:   # giống hệt push ở trên
      - 'can-app/**'
      - 'web/src/lib/**'
      - 'web/public/kho/bieu-tuong-192.png'
      - '.github/workflows/dong-goi-can.yml'
  workflow_dispatch:
    inputs:
      so_pr:
        description: Số PR muốn lấy bản thử, ví dụ 31 (để trống = đóng gói nhánh chọn ở trên)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Bản chính thức (main) chạy lần lượt: hai lượt cùng lúc có thể cùng tạo một Release, hay xoá bản của nhau.
  # Đẩy commit mới vào PR thì bỏ lượt cũ đang chạy.
  group: dong-goi-can-${{ github.event.pull_request.number || github.ref }}-${{ inputs.so_pr }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dong-goi:
    name: Đóng gói BeeftownCan.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # GIỐNG điều kiện "if" của job phat-hanh: main, không phải lượt PR, không gõ số PR.
      CHINH_THUC: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.so_pr == '' }}
    outputs:
      phien_ban: ${{ steps.ten.outputs.phien_ban }}
      ten: ${{ steps.ten.outputs.ten }}
    steps:
      - name: Chọn mã nguồn
        id: nguon
        env:
          SO_PR: ${{ inputs.so_pr }}
        run: |
          # Chỉ lượt chạy tay có ô "Số PR". Gõ "#31" hay " 31 " cũng được.
          SO_PR=$(printf '%s' "$SO_PR" | tr -d '#[:space:]')
          if [ -z "$SO_PR" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
          elif [[ "$SO_PR" =~ ^[0-9]+$ ]]; then
            # Đầu nhánh của PR, chưa gộp main: đúng mã người làm PR đã thử.
            echo "ref=refs/pull/$SO_PR/head" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Ô \"Số PR\" chỉ gõ số, ví dụ 31."
            exit 1
          fi
          echo "so_pr=$SO_PR" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.nguon.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          # Bản thử PR chạy mã chưa gộp trên nhánh main: không cho nó lưu bộ nhớ đệm npm mà lượt chính thức sẽ dùng lại.
          cache: ${{ inputs.so_pr == '' && 'npm' || '' }}
          package-manager-cache: false   # setup-node v5 tự bật cache nếu package.json gốc có packageManager — chỉ theo dòng trên
          cache-dependency-path: can-app/package-lock.json
      - name: Cài thư viện
        working-directory: can-app
        run: npm ci --no-audit --no-fund
      - name: Đọc phiên bản, đặt tên file
        id: ten
        env:
          SO_PR: ${{ steps.nguon.outputs.so_pr }}
        run: |
          # Dòng trong can-app/src/main.ts phải đúng dạng  const PHIEN_BAN = '2.1.0';  (test-quy-trinh.mjs giữ dạng này)
          PHIEN_BAN=$(sed -nE "s/^const PHIEN_BAN = '([0-9]+\.[0-9]+\.[0-9]+)';.*/\1/p" can-app/src/main.ts | head -n 1)
          if [ -z "$PHIEN_BAN" ]; then
            echo "::error file=can-app/src/main.ts::Không đọc được phiên bản: cần một dòng dạng  const PHIEN_BAN = '2.1.0';"
            exit 1
          fi
          MA=$(git rev-parse --short=7 HEAD)
          # Bản thử có chữ "thu" trong tên để không nhầm với bản chính thức.
          if [ "$CHINH_THUC" = true ]; then TEN="BeeftownCan-$PHIEN_BAN"
          elif [ -n "$SO_PR" ]; then TEN="BeeftownCan-$PHIEN_BAN-thu-PR$SO_PR-$MA"
          else TEN="BeeftownCan-$PHIEN_BAN-thu-$MA"
          fi
          {
            echo "phien_ban=$PHIEN_BAN"
            echo "ten=$TEN"
            echo "ma=$MA"
          } >> "$GITHUB_OUTPUT"
          echo "Beeftown Cân $PHIEN_BAN → $TEN"
      - name: Kiểm thử Beeftown Cân (cân giả, kho giả)
        # Lượt PR không tải file lên, và kiem-thu.yml chạy đúng kiểm thử này trên PR (PR nháp: khi bấm Ready).
        if: github.event_name != 'pull_request'
        working-directory: can-app
        run: npx bun test/thu.ts
      # 2.11 — giao diện trong Chromium thật cho từng vai, TRƯỚC khi đóng gói: bản .exe tự cập nhật xuống máy quầy, trang vỡ
      # (mọi vai chỉ thấy khung lỗi) không được lên Release. Playwright lấy từ web/ như kiem-thu.yml.
      # Bản thử PR (chạy tay, gõ số PR) lấy workflow này của main nhưng mã của PR: PR mở trước 2.11 chưa có file kiểm thử
      # này — bỏ qua hai bước, cảnh báo ở Summary, vẫn ra bản thử (kiem-thu.yml của PR đó đã chạy kiểm thử của nó).
      - name: Bản thử PR chưa có kiểm thử giao diện trong Chromium
        if: github.event_name != 'pull_request' && hashFiles('can-app/test/thu-trinh-duyet.ts') == ''
        run: echo "::warning::Mã này chưa có can-app/test/thu-trinh-duyet.ts (PR mở trước Beeftown Cân 2.11) — bỏ qua kiểm thử giao diện trong Chromium. Gộp main vào PR để có."
      - name: Cài Playwright và Chromium (web/)
        if: github.event_name != 'pull_request' && hashFiles('can-app/test/thu-trinh-duyet.ts') != ''
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Kiểm thử giao diện Beeftown Cân trong Chromium (từng vai)
        if: github.event_name != 'pull_request' && hashFiles('can-app/test/thu-trinh-duyet.ts') != ''
        working-directory: can-app
        run: npx bun test/thu-trinh-duyet.ts
      - name: Đóng gói BeeftownCan.exe (Bun tự tải bộ chạy cho Windows)
        working-directory: can-app
        run: npx bun scripts/dong-goi.ts
      - name: Kiểm file đóng gói
        id: file
        working-directory: can-app/dist
        run: |
          LOAI=$(file -b BeeftownCan.exe)
          echo "BeeftownCan.exe: $LOAI"
          # Phải là file chạy Windows 64-bit dạng cửa sổ: sai --target thì ra file Linux, Windows không mở được;
          # thiếu --windows-hide-console thì máy quầy hiện thêm một cửa sổ chữ đen.
          case "$LOAI" in
            *PE32+*GUI*x86-64*) ;;
            *) echo "::error::BeeftownCan.exe không phải file chạy Windows 64-bit dạng cửa sổ: $LOAI"; exit 1 ;;
          esac
          BYTE=$(stat -c %s BeeftownCan.exe)
          {
            # Số kiểu Việt, và MB theo cách Windows đếm (1 MB = 1024 × 1024 byte) để khớp với máy quầy.
            echo "mb=$(awk -v b="$BYTE" 'BEGIN { printf "%.1f", b / 1048576 }' | tr . ,)"
            echo "byte=$(printf '%s' "$BYTE" | sed -E ':a;s/([0-9])([0-9]{3})($|\.)/\1.\2\3/;ta')"
            echo "sha256=$(sha256sum BeeftownCan.exe | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Tải lên thành artifact
        id: artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ten.outputs.ten }}
          path: can-app/dist/BeeftownCan.exe
          if-no-files-found: error
          overwrite: true   # bấm "Re-run" một lượt đã tải lên thì thay file của chính lượt đó
          # Bản chính thức chỉ còn một (job phat-hanh xoá bản cũ), nên giữ lâu cũng không tốn thêm.
          retention-days: ${{ env.CHINH_THUC == 'true' && 90 || 7 }}
      - name: Ghi cách tải vào Summary
        env:
          PHIEN_BAN: ${{ steps.ten.outputs.phien_ban }}
          TEN: ${{ steps.ten.outputs.ten }}
          MA: ${{ steps.ten.outputs.ma }}
          SO_PR: ${{ steps.nguon.outputs.so_pr }}
          SU_KIEN: ${{ github.event_name }}
          NHANH: ${{ github.ref_name }}
          PR_SU_KIEN: ${{ github.event.pull_request.number }}
          MB: ${{ steps.file.outputs.mb }}
          BYTE: ${{ steps.file.outputs.byte }}
          SHA256: ${{ steps.file.outputs.sha256 }}
          LINK: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            if [ "$SU_KIEN" = pull_request ]; then
              echo "## ✅ Beeftown Cân $PHIEN_BAN — đóng gói được (lượt kiểm PR #$PR_SU_KIEN)"
              echo
              echo "Đóng gói ra \`BeeftownCan.exe\` $MB MB, đúng file chạy Windows. Lượt kiểm PR **không tải file lên** (tiết kiệm dung lượng); kiểm thử Beeftown Cân chạy ở workflow **Kiểm thử**."
              echo
              echo "Muốn tải bản thử của PR này: tab **Actions** → **Đóng gói Beeftown Cân** → **Run workflow** → ô số PR gõ **$PR_SU_KIEN** → **Run workflow**."
            else
              if [ "$CHINH_THUC" = true ]; then
                echo "## ✅ Beeftown Cân $PHIEN_BAN — bản chính thức (main)"
              elif [ -n "$SO_PR" ]; then
                echo "## 🧪 Beeftown Cân $PHIEN_BAN — BẢN THỬ của PR #$SO_PR, chưa gộp"
              else
                echo "## 🧪 Beeftown Cân $PHIEN_BAN — BẢN THỬ của nhánh $NHANH"
              fi
              echo
              echo "**[⬇ Tải $TEN]($LINK)** — file zip, giải nén ra \`BeeftownCan.exe\`. Hoặc kéo xuống mục **Artifacts** cuối trang."
              echo
              echo "| | |"
              echo "|---|---|"
              if [ -n "$SO_PR" ]; then echo "| Mã nguồn | PR #$SO_PR · commit \`$MA\` |"; else echo "| Mã nguồn | $NHANH · commit \`$MA\` |"; fi
              echo "| BeeftownCan.exe | $MB MB ($BYTE byte) |"
              echo "| SHA-256 | \`$SHA256\` |"
              if [ "$CHINH_THUC" = true ]; then
                echo "| Giữ ở tab Actions | tới khi main có bản mới hơn (tối đa 90 ngày); mỗi phiên bản còn một bản ở **Releases**, giữ mãi |"
              else
                echo "| Giữ ở tab Actions | 7 ngày. Bản thử chỉ để thử — xong thì quay về bản ở **Releases** |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  phat-hanh:
    name: Release khi có phiên bản mới · giữ một bản chính thức ở Actions
    needs: dong-goi
    # Chỉ bản chính thức. Điều kiện đọc thẳng từ GitHub, KHÔNG từ output của job dong-goi: lượt "bản thử PR"
    # chạy mã chưa gộp (npm ci, kiểm thử) trong job đó, không được mở đường tới quyền ghi ở đây.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.so_pr == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # tạo tag can-v<phiên bản> và Release
      actions: write    # xoá artifact chính thức của các lượt trước
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PHIEN_BAN: ${{ needs.dong-goi.outputs.phien_ban }}
      TEN: ${{ needs.dong-goi.outputs.ten }}
    steps:
      - name: Phiên bản này đã có Release chưa?
        id: da-co
        run: |
          if [ -z "$PHIEN_BAN" ] || [ -z "$TEN" ]; then
            echo "::error::Job dong-goi không trả về phiên bản / tên file."
            exit 1
          fi
          # Chỉ "release not found" mới là chưa có. Lỗi khác (mạng, GitHub 5xx) thì dừng, không đoán.
          if HOI=$(gh release view "can-v$PHIEN_BAN" --json tagName 2>&1); then
            echo "co=true" >> "$GITHUB_OUTPUT"
            echo "Beeftown Cân $PHIEN_BAN đã có Release — không tạo lại. Muốn có Release mới: tăng PHIEN_BAN trong can-app/src/main.ts." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$HOI" == *"release not found"* ]]; then
            # Tag còn mà Release đã bị xoá: tạo Release lúc này sẽ gắn file mới vào commit cũ của tag.
            if gh api "repos/$GH_REPO/git/ref/tags/can-v$PHIEN_BAN" > /dev/null 2>&1; then
              echo "::error::Tag can-v$PHIEN_BAN còn mà Release đã bị xoá. Muốn tạo lại Release: xoá tag đó (trang repo → Tags) rồi chạy lại; hoặc tăng PHIEN_BAN."
              exit 1
            fi
            echo "co=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Không hỏi được GitHub phiên bản $PHIEN_BAN đã có Release chưa: $HOI"
            exit 1
          fi
      - name: Lấy file vừa đóng gói
        if: steps.da-co.outputs.co == 'false'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.TEN }}
          path: ra
      - name: Tạo Release "Beeftown Cân ${{ env.PHIEN_BAN }}"
        id: tao-release
        if: steps.da-co.outputs.co == 'false'
        working-directory: ra
        run: |
          zip -9 -q "$TEN.zip" BeeftownCan.exe
          {
            echo "Beeftown Cân **$PHIEN_BAN**, đóng gói tự động từ main (commit ${GITHUB_SHA:0:7})."
            echo
            echo "**Cách dùng:** mục **Assets** bên dưới → bấm **$TEN.zip** (không bấm \"Source code\") → giải nén →"
            echo "chép \`BeeftownCan.exe\` vào máy tính ở quán, thay file cũ. Lần đầu mở, Windows có thể báo"
            echo "*Windows protected your PC* → **More info** → **Run anyway**."
            echo
            echo "SHA-256 của BeeftownCan.exe: \`$(sha256sum BeeftownCan.exe | cut -d' ' -f1)\`"
          } > ghi-chu.md
          LINK=$(gh release create "can-v$PHIEN_BAN" "$TEN.zip" --target "$GITHUB_SHA" \
                   --title "Beeftown Cân $PHIEN_BAN" --notes-file ghi-chu.md)
          echo "📦 Đã tạo Release [Beeftown Cân $PHIEN_BAN]($LINK) kèm $TEN.zip — giữ mãi." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bản cài công khai cho nút "Cập nhật" trong chương trình
        # Chương trình ở quán tự hỏi và tải từ kho công khai này (can-app/src/cap-nhat.ts, REPO_BAN_CAI — test-quy-trinh
        # kiểm hai chỗ trùng nhau). File .exe lấy từ Release riêng ở trên (vừa tạo, hoặc đã có khi chạy bù), đúng từng
        # byte bản đã phát hành. Token CHỈ ở bước này và chỉ ghi được kho công khai; không bao giờ ở job dong-goi (lượt
        # bản thử PR chạy mã chưa gộp ở đó).
        # Chỉ khi Release riêng chắc chắn có: vừa tạo xong, hoặc đã có từ trước (chạy bù). Hỏi / lấy file hỏng → không chạy.
        if: ${{ !cancelled() && steps.da-co.outcome == 'success' && (steps.da-co.outputs.co == 'true' || steps.tao-release.outcome == 'success') }}
        env:
          TOKEN_BAN_CAI: ${{ secrets.TOKEN_BAN_CAI_CAN }}
          REPO_BAN_CAI: volekhanh123/beeftown-can-ban-cai
        run: |
          if [ -z "$TOKEN_BAN_CAI" ]; then
            echo "::warning::Chưa có secret TOKEN_BAN_CAI_CAN — bản $PHIEN_BAN chưa lên $REPO_BAN_CAI, máy quầy chưa thấy nút Cập nhật. Release riêng vẫn đủ."
            echo "⚠️ Chưa có secret **TOKEN_BAN_CAI_CAN**: máy quầy chưa thấy bản $PHIEN_BAN qua nút Cập nhật. Cách thêm: can-app/README.md, mục \"Bản 2.5 — tự cập nhật\"." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Đã công bố → thôi. Còn nháp (lần trước hỏng giữa chừng — có thể thiếu file) → xoá nháp, làm lại từ đầu; không
          # bao giờ công bố một nháp chưa rõ đủ file. Chỉ "release not found" mới là chưa có; lỗi khác (token hết hạn, sai
          # quyền) → đỏ, để máy quầy không lặng lẽ thôi nhận bản mới.
          if HOI=$(GH_TOKEN="$TOKEN_BAN_CAI" gh release view "can-v$PHIEN_BAN" --repo "$REPO_BAN_CAI" --json isDraft -q .isDraft 2>&1); then
            if [ "$HOI" = "false" ]; then
              echo "Bản cài $PHIEN_BAN đã có trên $REPO_BAN_CAI." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            GH_TOKEN="$TOKEN_BAN_CAI" gh release delete "can-v$PHIEN_BAN" --repo "$REPO_BAN_CAI" --yes
            echo "Đã xoá bản nháp dở can-v$PHIEN_BAN trên $REPO_BAN_CAI — làm lại."
          elif [[ "$HOI" == *"release not found"* ]]; then
            :
          else
            echo "::error::Không hỏi được $REPO_BAN_CAI (secret TOKEN_BAN_CAI_CAN hết hạn hay sai quyền?): $HOI"
            exit 1
          fi
          # Bản mới hơn đã là "mới nhất" (chạy bù bản cũ) thì không giành lại chữ "mới nhất".
          MOI_NHAT=$(GH_TOKEN="$TOKEN_BAN_CAI" gh release view --repo "$REPO_BAN_CAI" --json tagName -q .tagName 2>/dev/null || true)
          LATEST=--latest
          if [ -n "$MOI_NHAT" ] && [ "$(printf '%s\n%s\n' "${MOI_NHAT#can-v}" "$PHIEN_BAN" | sort -V | tail -n 1)" != "$PHIEN_BAN" ]; then
            LATEST=--latest=false
          fi
          mkdir -p ban-cai && cd ban-cai
          gh release download "can-v$PHIEN_BAN" --pattern "$TEN.zip"
          unzip -q "$TEN.zip" BeeftownCan.exe
          case "$(file -b BeeftownCan.exe)" in
            *PE32+*GUI*x86-64*) ;;
            *) echo "::error::BeeftownCan.exe trong Release không phải file chạy Windows 64-bit: $(file -b BeeftownCan.exe)"; exit 1 ;;
          esac
          jq -n --arg phienBan "$PHIEN_BAN" --arg sha256 "$(sha256sum BeeftownCan.exe | cut -d' ' -f1)" \
            --argjson kichThuoc "$(stat -c %s BeeftownCan.exe)" --arg ngay "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{dang: 1, phienBan: $phienBan, tep: "BeeftownCan.exe", sha256: $sha256, kichThuoc: $kichThuoc, ngay: $ngay}' > phien-ban.json
          # Tạo nháp (tải đủ hai file) rồi mới công bố: phiếu không bao giờ hiện trước file; "mới nhất" chỉ đổi lúc công bố.
          GH_TOKEN="$TOKEN_BAN_CAI" gh release create "can-v$PHIEN_BAN" BeeftownCan.exe phien-ban.json --repo "$REPO_BAN_CAI" \
            --draft --title "Beeftown Cân $PHIEN_BAN" \
            --notes "Bản cài Beeftown Cân $PHIEN_BAN — chương trình ở quán tự tải qua nút Cập nhật. Kho này chỉ chứa file cài, không có mã nguồn."
          TEP=$(GH_TOKEN="$TOKEN_BAN_CAI" gh release view "can-v$PHIEN_BAN" --repo "$REPO_BAN_CAI" --json assets -q '[.assets[].name] | sort | join(",")')
          if [ "$TEP" != "BeeftownCan.exe,phien-ban.json" ]; then
            echo "::error::Bản nháp can-v$PHIEN_BAN trên $REPO_BAN_CAI thiếu file ($TEP) — không công bố. Chạy lại workflow."
            exit 1
          fi
          GH_TOKEN="$TOKEN_BAN_CAI" gh release edit "can-v$PHIEN_BAN" --repo "$REPO_BAN_CAI" --draft=false "$LATEST"
          echo "🔄 Đã đưa bản cài $PHIEN_BAN lên $REPO_BAN_CAI — máy quầy thấy nút Cập nhật ở lần mở sau." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tab Actions chỉ giữ bản chính thức mới nhất
        # Tạo Release hỏng thì vẫn dọn: file của lượt này đã tải lên xong ở job dong-goi.
        if: ${{ !cancelled() }}
        run: |
          # Bản chính thức tên đúng "BeeftownCan-<số>.<số>.<số>"; bản thử có thêm "-thu-…" nên không bị đụng.
          # Chỉ xoá bản của lượt CŨ HƠN (số lượt nhỏ hơn): bấm "Re-run" một lượt cũ không được xoá bản mới nhất.
          # Đọc hết danh sách rồi mới xoá — xoá trong lúc đang lật trang làm trang sau lệch, sót bản cũ.
          CU=$(gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            | jq -r --argjson luot "$GITHUB_RUN_ID" '.artifacts[]
                | select(.expired | not)
                | select(.name | test("^BeeftownCan-[0-9]+[.][0-9]+[.][0-9]+$"))
                | select(.workflow_run.id < $luot)
                | .id')
          for ID in $CU; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$ID"
            echo "Đã xoá artifact cũ $ID"
          done
